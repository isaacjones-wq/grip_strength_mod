# CI: Build the mod with Gradle and upload the built jar as an artifact
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build
      run: ./gradlew build --no-daemon

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: grip-strength-mod-jar
        path: build/libs/**.jar
